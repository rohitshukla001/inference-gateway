global:
  scrape_interval: 5s
  evaluation_interval: 15s

scrape_configs:
  - job_name: gateway
    static_configs:
      - targets:
          - host.docker.internal:8080
        labels:
          service: gateway

  - job_name: orchestrator
    static_configs:
      - targets:
          - host.docker.internal:9091
        labels:
          service: orchestrator

  - job_name: prometheus
    static_configs:
      - targets:
          - localhost:9090
