services:
  # ---- Infrastructure ----

  ollama:
    image: ollama/ollama:latest
    container_name: ig-ollama
    ports:
      - "127.0.0.1:11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    container_name: ig-postgres
    environment:
      POSTGRES_USER: inference
      POSTGRES_PASSWORD: inference
      POSTGRES_DB: inference_gateway
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: ig-redis
    ports:
      - "127.0.0.1:6379:6379"
    restart: unless-stopped

  nats:
    image: nats:2.10-alpine
    container_name: ig-nats
    ports:
      - "127.0.0.1:4222:4222"   # client
      - "127.0.0.1:8222:8222"   # monitoring
    # -js enables JetStream so async jobs survive until a worker acks them.
    command: ["-js", "-sd", "/data", "-m", "8222"]
    volumes:
      - nats_data:/data
    restart: unless-stopped

  # ---- Observability ----

  prometheus:
    image: prom/prometheus:v2.55.0
    container_name: ig-prometheus
    ports:
      - "127.0.0.1:9094:9090"   # 9090 is taken on the host by the orchestrator gRPC
    volumes:
      - ./deployments/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.3.0
    container_name: ig-grafana
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: "Admin"
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
    volumes:
      - ./deployments/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./deployments/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
    restart: unless-stopped

  jaeger:
    image: jaegertracing/all-in-one:1.60
    container_name: ig-jaeger
    ports:
      - "127.0.0.1:16686:16686"  # UI
      - "127.0.0.1:4317:4317"    # OTLP gRPC
      - "127.0.0.1:4318:4318"    # OTLP HTTP
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    restart: unless-stopped

volumes:
  ollama_data:
  pg_data:
  grafana_data:
  nats_data:
